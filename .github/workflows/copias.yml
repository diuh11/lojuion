name: Copias por TV

on:
  workflow_run:
    workflows: ["Actualizar"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Crear 30 copias
        run: |
          TOTAL=30

          mkdir -p listas
          rm -f listas/*.m3u

          for i in $(seq 1 $TOTAL); do
            DESTINO="listas/dispositivo$i.m3u"
            cp lista.m3u "$DESTINO"
            echo "dispositivo$i: https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/$DESTINO"
          done

      - name: Subir cambios
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A listas
          git commit -m "Copias por TV actualizadas" || exit 0
          git push
