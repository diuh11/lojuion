name: Copias por TV

on:
  workflow_run:
    workflows: ["Actualizar"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Crear 100 copias con nombre aleatorio
        run: |
          TOTAL=100
          mkdir -p listas

          # Los nombres se generan UNA sola vez y se guardan,
          # para que las URLs no cambien en cada ejecución.
          touch listas/nombres.txt
          while [ "$(wc -l < listas/nombres.txt)" -lt "$TOTAL" ]; do
            N=$(openssl rand -base64 60 | tr -dc 'a-z0-9' | cut -c1-5)
            [ ${#N} -eq 5 ] || continue
            grep -qx "$N" listas/nombres.txt || echo "$N" >> listas/nombres.txt
          done

          rm -f listas/*.m3u
          head -n "$TOTAL" listas/nombres.txt | while read NOMBRE; do
            cp lista.m3u "listas/$NOMBRE.m3u"
            echo "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/listas/$NOMBRE.m3u"
          done

      - name: Subir cambios
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A listas
          git commit -m "Copias por TV actualizadas" || exit 0
          git push
